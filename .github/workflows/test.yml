name: Test

on:
  push:
    paths-ignore: ["data/**", "reports/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx src/selftest.ts
      - run: npm run dry-run
      - name: Live feeds reachable
        run: npm run check-sources
